{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autentificare</title>
  <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
  <link rel="stylesheet" href="{% static 'CSS/login_style.css' %}">
</head>
<body>
  <div class="login-container">
    <div class="separator"></div>

    <div class="login-form">
      <h2>Autentificare</h2>

      {% if eroare %}
        <p style="color: #ff4d4d; font-size: 14px; margin-bottom: 10px; text-align: center;">
            {{ eroare }}
        </p>
      {% endif %}

      <form method="POST">
        {% csrf_token %} <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="parola" placeholder="Parola" required />

        <label class="role-label" for="roleSelect">Tip cont</label>
        <select name="rol" id="roleSelect" class="role-select">
          <option value="elev" selected>Student</option>
          <option value="profesor">Profesor</option>
        </select>

        <button class="login-btn" type="submit">
          Conectează-te
        </button>
      </form>

      <p class="register-text">
        Nu ai cont? <a href="{% url 'register' %}">Înregistrează-te</a>
      </p>
    </div>
  </div>

  </body>
</html>
